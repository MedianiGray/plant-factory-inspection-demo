<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>页面不存在 · 数智植物工厂</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<style>
  :root{--ink:#0c1626;--ink2:#47586f;--dim:#77869b;--line:#e6ebf2;--accent:#1257d8;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:#fff;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:32px;}
  .wrap{width:100%;max-width:560px;}
  .code{font-family:Consolas,"SFMono-Regular",monospace;font-size:clamp(64px,16vw,120px);
    line-height:1;letter-spacing:-2px;color:var(--ink);margin:0 0 22px;}
  .rule{height:1px;background:var(--line);margin:0 0 26px;}
  h1{font-size:22px;font-weight:600;margin:0 0 10px;}
  p{font-size:15px;line-height:1.7;color:var(--ink2);margin:0 0 34px;}
  .links{display:flex;flex-wrap:wrap;gap:12px;}
  a{font-size:14px;text-decoration:none;padding:10px 18px;border:1px solid var(--line);border-radius:8px;color:var(--ink);}
  a.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  a:hover{border-color:#c9d4e3;}
  a.primary:hover{border-color:var(--accent);opacity:.92;}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .back{display:block;margin-top:38px;font-size:13px;color:var(--dim);border:0;padding:0;background:none;font:inherit;cursor:pointer;}
</style>
</head>
<body>
  <main class="wrap">
    <p class="code">404</p>
    <div class="rule"></div>
    <h1>这个地址没有对应页面</h1>
    <p>链接可能已更换，或页面被移动。下面三个入口都仍然有效，可直接回到官网、在线演示或网页版汇报。</p>
    <nav class="links" aria-label="可用入口">
      <a class="primary" href="official.html">回到官网</a>
      <a href="index.html">三维巡检演示</a>
      <a href="slides.html">网页版汇报</a>
    </nav>
    <button type="button" class="back" onclick="history.back()">← 返回上一页</button>
  </main>
</body>
</html>
